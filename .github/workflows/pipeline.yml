# DART 수집 → app/public/data/*.json 커밋
#
# 스케줄은 UTC 다. 한국 장 운영시간(09:00~18:00 KST)은 UTC 00:00~09:00 이므로
# 평일 UTC 0~9시에 30분 간격으로 돈다.
#
# ⚠️ GitHub Actions 의 cron 은 정시 실행을 보장하지 않는다. 무료 러너가 붐비면
#    수 분~수십 분 밀린다. 그래서 화면이 meta.lastUpdated 실값으로 신선도를 표시한다.
name: pipeline

on:
  schedule:
    - cron: '*/30 0-9 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: '수집할 기간(일). 비우면 증분(최근 3일)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # pipeline 은 의존성이 없다(zlib·fetch 내장, Node 네이티브 TS 실행).
      # npm ci 를 부를 lockfile 도 없으므로 설치 단계 자체가 필요 없다.
      - name: 수집 실행
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DART_KEY" ]; then
            echo "::error::DART_KEY Secret 이 없습니다. 저장소 Settings > Secrets and variables > Actions 에서 등록하세요."
            exit 1
          fi
          if [ -n "${{ inputs.days }}" ]; then
            node pipeline/src/fetch.ts --days ${{ inputs.days }}
          else
            node pipeline/src/fetch.ts --incremental
          fi

      - name: 변경이 있을 때만 커밋
        run: |
          git config user.name  "bigboard-bot"
          git config user.email "actions@github.com"
          git add app/public/data
          if git diff --staged --quiet; then
            echo "새 공시 없음 — 커밋 생략"
          else
            COUNT=$(node -p "require('./app/public/data/meta.json').counts.disclosures")
            git commit -m "data: 공시 ${COUNT}건 (자동 수집)"
            git push
          fi
